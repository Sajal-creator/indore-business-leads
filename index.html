  // Particles
  (function() {
    const c = document.getElementById('particles-canvas'), ctx = c.getContext('2d');
    let w, h, particles = [], mouse = {x:0,y:0};
    function resize() { w = c.width = innerWidth; h = c.height = innerHeight; }
    resize(); addEventListener('resize', resize);
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    class P {
      constructor() { this.reset(); }
      reset() { this.x = Math.random()*w; this.y = Math.random()*h; this.size = Math.random()*2+0.5; this.speedX = (Math.random()-0.5)*0.4; this.speedY = (Math.random()-0.5)*0.4; this.opacity = Math.random()*0.5+0.1; }
      update() { this.x+=this.speedX; this.y+=this.speedY; if(this.x<0||this.x>w||this.y<0||this.y>h) this.reset(); }
      draw() { ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fillStyle=`rgba(162,155,254,${this.opacity})`; ctx.fill(); }
    }
    for(let i=0;i<80;i++) particles.push(new P());
    function animate() {
      ctx.clearRect(0,0,w,h);
      particles.forEach(p => { p.update(); p.draw(); });
      particles.forEach(p => {
        let dx=mouse.x-p.x, dy=mouse.y-p.y, dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<200) { ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(mouse.x,mouse.y); ctx.strokeStyle=`rgba(162,155,254,${0.08*(1-dist/200)})`; ctx.lineWidth=0.5; ctx.stroke(); }
      });
      requestAnimationFrame(animate);
    }
    animate();
  })();

  // Stars helper
  function starStr(r) {
    const full = Math.floor(r), half = r - full >= 0.5;
    return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - (half?1:0));
  }

  function renderFilters() {
    const cats = [...new Set(leads.map(l=>l.cat))];
    let html = '<button class="filter-tab active" data-cat="all">All Categories</button>';
    cats.forEach(c => html += `<button class="filter-tab" data-cat="${c}">${c} (${leads.filter(l=>l.cat===c).length})</button>`);
    document.getElementById('filterTabs').innerHTML = html;
    document.querySelectorAll('.filter-tab').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); window.activeCat = b.dataset.cat; renderLeads();
    }));
  }

  let activeCat = 'all', searchQ = '', showPriority = false;

  function renderLeads() {
    const f = leads.filter(l => {
      const mc = activeCat === 'all' || l.cat === activeCat;
      const ms = !searchQ || l.name.toLowerCase().includes(searchQ) || l.cat.toLowerCase().includes(searchQ) || l.type.toLowerCase().includes(searchQ) || l.address.toLowerCase().includes(searchQ);
      const mp = !showPriority || !l.hasWebsite;
      return mc && ms && mp;
    });

    if(!f.length) { document.getElementById('leadsGrid').innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>No leads found</h3><p>Try adjusting your filters</p></div>'; return; }

    let html = '';
    f.forEach((l,i) => {
      const sb = l.hasWebsite ? `<span class="badge badge-website">✅ Website</span>` : `<span class="badge badge-no-website">❌ No Website</span>`;
      const pb = l.priority ? `<span class="badge badge-priority">🎯 Target</span>` : '';
      const cb = `<span class="badge badge-confidence">${l.confidence}%</span>`;
      const cls = `lead-card${l.priority?' priority':''}${!l.hasWebsite?' no-site':''}`;
      const stars = starStr(l.rating);
      const potCls = l.potential === 'VERY HIGH' ? 'potential-very-high' : l.potential === 'HIGH' ? 'potential-high' : 'potential-medium';

      html += `
        <div class="${cls}" onclick="openModal(${l.id})" style="animation-delay:${(i*0.02).toFixed(2)}s">
          <div class="card-header">
            <div class="card-title">${l.icon} ${l.name}</div>
            <div class="card-badges">${sb}${pb}${cb}</div>
          </div>
          <div class="card-category">${l.cat} · ${l.type}</div>
          <div class="rating-stars">
            <span class="stars">${stars}</span>
            <span class="rating-num">${l.rating}</span>
            <span class="review-count">(${l.reviews} reviews)</span>
          </div>
          <div class="click-hint">👆 Click for full details</div>
        </div>`;
    });
    document.getElementById('leadsGrid').innerHTML = html;
  }

        ${l.phone ? `<a href="tel:${l.phone.replace(/[^0-9+]/g,'')}" class="modal-btn primary">📞 Call Now</a>` : ''}
        ${l.hasWebsite && l.website ? `<a href="https://${l.website}" target="_blank" rel="noopener" class="modal-btn secondary">🌐 Visit Website</a>` : ''}
        <a href="https://www.google.com/maps/search/${encodeURIComponent(l.name+' Indore')}" target="_blank" rel="noopener" class="modal-btn secondary">📍 Google Maps</a>
        <button class="modal-btn secondary" onclick="document.getElementById('modalOverlay').classList.remove('open')">Close</button>
      </div>
    `;

    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  document.getElementById('modalClose').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  });
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if(e.target === document.getElementById('modalOverlay')) {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; }
  });

  // Search & filter
  document.getElementById('searchInput').addEventListener('input', e => { searchQ = e.target.value.toLowerCase().trim(); renderLeads(); });
  document.getElementById('priorityToggle').addEventListener('click', () => {
    showPriority = !showPriority;
    document.getElementById('priorityToggle').classList.toggle('active');
    document.getElementById('priorityToggle').textContent = showPriority ? '🎯 Showing No-Website Leads' : '🎯 No Website Leads Only';
    renderLeads();
  });

  // Init
  window.activeCat = 'all';
  renderStats();
  renderFilters();
  renderLeads();
</script>
</body>
</html>
